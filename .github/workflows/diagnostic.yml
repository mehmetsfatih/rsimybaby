name: Runner and Bybit diagnostic
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/diagnostic.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Confirm runner and public market access
        run: |
          python3 - <<'PY'
          import json
          from urllib.request import urlopen
          from urllib.error import HTTPError
          print("GitHub runner started", flush=True)
          for path in ["/v5/market/time", "/v5/market/kline?category=linear&symbol=BTCUSDT&interval=15&limit=2"]:
              try:
                  with urlopen("https://api.bybit.com" + path, timeout=20) as response:
                      data = json.load(response)
                  assert data["retCode"] == 0, data.get("retMsg")
                  print(path, "OK", flush=True)
              except HTTPError as error:
                  print("Bybit HTTP", error.code, flush=True)
                  raise SystemExit(1)
          PY
