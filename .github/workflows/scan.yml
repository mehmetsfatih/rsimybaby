name: Binance RSI alerts
on:
  schedule:
    - cron: '2,17,32,47 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rsi-monitor
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test calculations and recovery
        run: python -m unittest test_monitor -v
      - name: Verify public Binance Futures access
        run: |
          python - <<'PYTHON'
          from monitor import binance
          print('Binance server time:', binance('/fapi/v1/time')['serverTime'])
          candles = binance('/fapi/v1/klines', symbol='BTCUSDT', interval='15m', limit=2)
          assert len(candles) == 2, 'Missing live candles'
          print('Live BTCUSDT 15m candles accessible')
          PYTHON
      - name: Scan closed candles and notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python monitor.py
      - name: Save progress even if notification failed
        if: always()
        run: |
          if [ ! -f data/state.json ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/state.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Save RSI progress'
          git pull --rebase origin "${{ github.event.repository.default_branch }}"
          git push
